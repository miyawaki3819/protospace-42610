<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link th:href="@{/css/style.css}" rel="stylesheet" type="text/css" />
    <title>Protospace</title>
  </head>

  <body>
    <div th:insert="~{header :: header}"></div>
    <div class="main">
      <div class="inner">
        <div class="form__wrapper">
          <h2 class="page-heading">ユーザー新規登録</h2>

          <form
            th:action="@{/user}"
            th:object="${userForm}"
            th:method="post"
            class="form__new"
          >
            <div class="field">
              <label for="user_email">メールアドレス</label><br />
              <input
                type="email"
                id="user_email"
                th:field="*{email}"
                autofocus="autofocus"
                autocomplete="email"
              />
              <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red;"></span>
            </div>

            <div class="field">
              <label for="user_password">パスワード（6文字以上）</label><br />
              <input
                type="password"
                id="user_password"
                th:field="*{password}"
                autocomplete="new-password"
              />
              <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red;"></span>
            </div>

            <div class="field">
              <label for="user_password_confirmation">パスワード再入力</label><br />
              <input
                type="password"
                id="user_password_confirmation"
                th:field="*{passwordConfirmation}"
                autocomplete="new-password"
              />
              <span th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}" style="color: red;"></span>
            </div>

            <div class="field">
              <label for="user_name">ユーザー名</label><br />
              <input type="text" id="user_name" th:field="*{name}" />
              <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red;"></span>
            </div>

            <div class="field">
              <label for="user_profile">プロフィール</label><br />
              <textarea class="form__text" id="user_profile" th:field="*{profile}"></textarea>
              <span th:if="${#fields.hasErrors('profile')}" th:errors="*{profile}" style="color: red;"></span>
            </div>

            <div class="field">
              <label for="user_occupation">所属</label><br />
              <input type="text" id="user_occupation" th:field="*{occupation}" />
              <span th:if="${#fields.hasErrors('occupation')}" th:errors="*{occupation}" style="color: red;"></span>
            </div>

            <div class="field">
              <label for="user_position">役職</label><br />
              <input type="text" id="user_position" th:field="*{position}" />
              <span th:if="${#fields.hasErrors('position')}" th:errors="*{position}" style="color: red;"></span>
            </div>

            <div class="actions">
              <input type="submit" value="新規登録" class="form__btn" />
            </div>
          </form>
        </div>
      </div>
    </div>
    <div th:insert="~{footer :: footer}"></div>
  </body>
</html>
