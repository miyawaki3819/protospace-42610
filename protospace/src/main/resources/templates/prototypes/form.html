<div xmlns:th="http://www.thymeleaf.org" th:fragment="form(actionUrl, prototypeForm, requireImage)">
  <div th:if="${errorMessages != null && !errorMessages.isEmpty()}" class="error-messages">
    <ul>
      <li th:each="message : ${errorMessages}" th:text="${message}"></li>
    </ul>
  </div>
  <form th:action="${actionUrl}" th:object="${prototypeForm}" enctype="multipart/form-data" th:method="post">
    <div class="field">
      <label for="prototype_title">プロトタイプの名称</label><br />
      <input type="text" id="prototype_title" th:field="*{title}" />
    </div>

    <div class="field">
      <label for="prototype_catch_copy">キャッチコピー</label><br />
      <textarea
        id="prototype_catch_copy"
        class="form__text"
        th:field="*{catchCopy}"
      ></textarea>
    </div>

    <div class="field">
      <label for="prototype_concept">コンセプト</label><br />
      <textarea id="prototype_concept" class="form__text" th:field="*{concept}"></textarea>
    </div>

    <!-- 画像投稿機能 -->
    <div class="field">
      <label for="prototype_image">プロトタイプの画像</label><br />
      <input type="file" th:field="*{imageFile}" id="prototype_image" accept="image/*" th:required="${requireImage}" />
    </div>

    <div class="actions">
      <button type="submit" class="form__btn">保存する</button>
    </div>
  </form>
</div>
